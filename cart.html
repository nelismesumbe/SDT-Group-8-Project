<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gadget Hub | Cart</title>
  <link rel="stylesheet" href="cart.css" />
</head>
<body>
  <header class="header">
    <h1>🛒 Gadget Hub - Your Cart</h1>
    <a href="index.html" class="back-btn">← Continue Shopping</a>
  </header>

  <main class="cart-container">
    <div class="cart-items" id="cart-items">
      <!-- Cart items added by JS -->
    </div>

    <div class="cart-summary">
      <h2>Order Summary</h2>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">0 FCFA</span>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <span id="delivery">1,000 FCFA</span>
      </div>
      <hr />
      <div class="summary-row total">
        <span>Total</span>
        <span id="total">0 FCFA</span>
      </div>

      <button class="checkout-btn" id="checkoutBtn">Checkout</button>
    </div>
  </main>

  <script src="cart.js"></script>
</body>
</html>
